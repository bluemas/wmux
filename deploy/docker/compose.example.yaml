# One isolated wmux per person behind Traefik, signed in with the company's
# OIDC provider through oauth2-proxy. Copy a user block to add one.
#
#   WMUX_DOMAIN=wmux.example.com OIDC_ISSUER_URL=... OIDC_CLIENT_ID=... \
#   OIDC_CLIENT_SECRET=... OAUTH2_PROXY_COOKIE_SECRET=$(openssl rand -hex 16) \
#   docker compose -f compose.example.yaml up -d
#
# Isolation: each user has their own container, home volume and network.
# Only Traefik joins every user network, so one user's container cannot
# reach another's. Containers run unprivileged with no added capabilities,
# never get the Docker socket, and have CPU, memory and process limits.
# Whoever administers the host can still see every container.
#
# Access: every request first needs a company sign-in (oauth2-proxy), then
# the per-user middleware admits only that user's address. Register the
# OIDC client with redirect URIs https://<user>.${WMUX_DOMAIN}/oauth2/callback.
#
# Trusted proxy: Traefik passes the signed-in email to wmux, which admits it
# without the wmux token only when it comes from Traefik's fixed address on
# that user's network (WMUX_TRUST_PROXY_FROM) and matches WMUX_TRUST_PROXY_USER.
# Keep both in step with the user's allowed_emails and network below.
#
# TLS is Traefik's job (for a VPN-only host, a DNS-challenge certificate
# keeps the name public and the address private). Fill in the resolver below.

x-wmux-user: &wmux-user
  image: wmux-server
  build:
    context: .
    args:
      WMUX_VERSION: ${WMUX_VERSION:-4.11.0}
      WMUX_SHA256: ${WMUX_SHA256:-}
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 2048
  mem_limit: 8g
  cpus: 4

services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://docker-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --entrypoints.websecure.address=:443
      # - --certificatesresolvers.le.acme.dnschallenge.provider=<your-dns-provider>
      # - --certificatesresolvers.le.acme.email=<admin email>
      # - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports: ["443:443"]
    volumes:
      - letsencrypt:/letsencrypt
    networks:
      docker-api: {}
      auth: {}
      # Fixed, and outside each network's ip_range so no container can take it.
      wmux-alice:
        ipv4_address: 172.30.1.2
      wmux-bob:
        ipv4_address: 172.30.2.2

  # Traefik reads containers through this filter, never the raw socket: a
  # read-only bind mount does not make the Docker API read-only, so a
  # compromised Traefik with the socket could control every container. The
  # proxy passes only GET on containers, events and version.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      EVENTS: 1
      VERSION: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    restart: unless-stopped
    command:
      - --http-address=0.0.0.0:4180
      - --provider=oidc
      - --oidc-issuer-url=${OIDC_ISSUER_URL}
      - --client-id=${OIDC_CLIENT_ID}
      - --client-secret-file=/run/secrets/oidc_client_secret
      - --cookie-secret-file=/run/secrets/oauth2_cookie_secret
      - --email-domain=*
      - --reverse-proxy=true
      - --skip-provider-button=true
      - --upstream=static://202
      - --whitelist-domain=.${WMUX_DOMAIN}
      - --set-xauthrequest=true
      - --cookie-samesite=lax
    secrets: [oidc_client_secret, oauth2_cookie_secret]
    networks: [auth]
    labels:
      - traefik.enable=true
      - traefik.http.services.oauth2-proxy.loadbalancer.server.port=4180
      # Signs the browser in (302 to the provider) or lets a signed-in request through.
      - traefik.http.middlewares.signin.forwardauth.address=http://oauth2-proxy:4180/
      - traefik.http.middlewares.signin.forwardauth.trustForwardHeader=true
      # First in every user's chain: a client's own identity header never
      # reaches wmux; only the one the -only check copies from oauth2-proxy does.
      - traefik.http.middlewares.no-client-identity.headers.customrequestheaders.X-Auth-Request-Email=
      # The provider's callback and the sign-in start, on every user's host.
      - traefik.http.routers.oauth2.rule=PathPrefix(`/oauth2/`)
      # Above every user router, or a callback would hit the sign-in check again.
      - traefik.http.routers.oauth2.priority=1000
      - traefik.http.routers.oauth2.entrypoints=websecure
      - traefik.http.routers.oauth2.tls=true
      # - traefik.http.routers.oauth2.tls.certresolver=le

  alice:
    <<: *wmux-user
    hostname: alice
    environment:
      WMUX_ALLOW_HOST: alice.${WMUX_DOMAIN}
      WMUX_TRUST_PROXY_USER: alice@example.com
      WMUX_TRUST_PROXY_FROM: 172.30.1.2
    volumes: [alice-home:/home/wmux]
    networks: [wmux-alice]
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.alice-only.forwardauth.address=http://oauth2-proxy:4180/oauth2/auth?allowed_emails=alice@example.com
      - traefik.http.middlewares.alice-only.forwardauth.authResponseHeaders=X-Auth-Request-Email
      - traefik.http.routers.alice.rule=Host(`alice.${WMUX_DOMAIN}`)
      - traefik.http.routers.alice.entrypoints=websecure
      - traefik.http.routers.alice.tls=true
      # - traefik.http.routers.alice.tls.certresolver=le
      - traefik.http.routers.alice.middlewares=no-client-identity@docker,signin@docker,alice-only@docker
      - traefik.http.services.alice.loadbalancer.server.port=7681

  bob:
    <<: *wmux-user
    hostname: bob
    environment:
      WMUX_ALLOW_HOST: bob.${WMUX_DOMAIN}
      WMUX_TRUST_PROXY_USER: bob@example.com
      WMUX_TRUST_PROXY_FROM: 172.30.2.2
    volumes: [bob-home:/home/wmux]
    networks: [wmux-bob]
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.bob-only.forwardauth.address=http://oauth2-proxy:4180/oauth2/auth?allowed_emails=bob@example.com
      - traefik.http.middlewares.bob-only.forwardauth.authResponseHeaders=X-Auth-Request-Email
      - traefik.http.routers.bob.rule=Host(`bob.${WMUX_DOMAIN}`)
      - traefik.http.routers.bob.entrypoints=websecure
      - traefik.http.routers.bob.tls=true
      # - traefik.http.routers.bob.tls.certresolver=le
      - traefik.http.routers.bob.middlewares=no-client-identity@docker,signin@docker,bob-only@docker
      - traefik.http.services.bob.loadbalancer.server.port=7681

secrets:
  oidc_client_secret:
    environment: OIDC_CLIENT_SECRET
  oauth2_cookie_secret:
    environment: OAUTH2_PROXY_COOKIE_SECRET

networks:
  docker-api:
    internal: true
  auth: {}
  # Any private ranges unused on the host. Containers get addresses from
  # ip_range only; Traefik's fixed address sits below it.
  wmux-alice:
    ipam:
      config:
        - subnet: 172.30.1.0/24
          ip_range: 172.30.1.128/25
  wmux-bob:
    ipam:
      config:
        - subnet: 172.30.2.0/24
          ip_range: 172.30.2.128/25

volumes:
  letsencrypt: {}
  alice-home: {}
  bob-home: {}
