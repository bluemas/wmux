<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Office</title>
<style>
:root { color-scheme: light dark; font: 13px system-ui,sans-serif; background: Canvas; color: CanvasText; }
body { margin: 0; }
/* The page never scrolls: office.js scales the room to the free area (--fit)
   and sizes the stage to the scaled room, which the grid centres. */
#page { position: relative; height: 100vh; overflow: hidden; box-sizing: border-box; padding: 12px 16px;
  display: grid; place-items: center; }
#stage { position: relative; }
#room { position: absolute; left: 0; top: 0; transform: scale(var(--fit, 1)); transform-origin: 0 0; }
#notice { position: absolute; top: 8px; left: 50%; z-index: 200000; transform: translateX(-50%); width: max-content;
  max-width: calc(100% - 32px); margin: 0; padding: 4px 10px; border-radius: 6px; background: Canvas; opacity: .85; }
#notice[hidden] { display: none; }
#empty { position: absolute; top: 45%; left: 50%; z-index: 200000; transform: translate(-50%, -50%); max-width: 320px;
  padding: 12px 16px; border-radius: 10px; background: Canvas; box-shadow: 0 4px 16px #0004; text-align: center; }
#empty p { margin: 0; } #empty-hint { margin-top: 4px !important; opacity: .7; font-size: 12px; }

/* Every sprite is drawn at 1x and scaled by a transform. */
.sprite { position: absolute; display: block; background-repeat: no-repeat; image-rendering: pixelated;
  transform: scale(2); transform-origin: 0 0; pointer-events: none; }
/* The floor, rugs and walls, painted at 1x into one canvas and scaled as a whole. */
.backdrop { position: absolute; left: 0; top: 0; z-index: 0; image-rendering: pixelated; pointer-events: none; }
.sprite.loop { animation: frames var(--frame-time, 1s) steps(2) infinite; }
@keyframes frames { from { background-position-x: var(--frame-from); } to { background-position-x: var(--frame-to); } }

/* The employee box is not hit-testable (frames overlap their neighbours); its
   body, name and bubble are. No z-index here, so each part stacks by depth. */
.employee { position: absolute; display: block; padding: 0; margin: 0; border: 0; background: none; color: inherit;
  font: inherit; cursor: pointer; pointer-events: none; }
.employee:disabled { cursor: default; }
.employee:focus { outline: none; }
/* Only while walking between spots (keep in step with WALK_MS in office.js). */
.employee[data-walking] { transition: left .9s ease-in-out, top .9s ease-in-out; }
.hit { position: absolute; left: 12px; top: 8px; width: 64px; height: 92px; pointer-events: auto; }

/* Names and bubbles take back part of the room's scale (--text), so they stay readable. */
.tag { position: absolute; transform: translateX(-50%) scale(var(--text, 1)); transform-origin: 50% 0; width: max-content;
  padding: 1px 6px; border-radius: 6px; background: rgba(32, 30, 40, .78); color: #fdfcf8; font-size: 11px; line-height: 16px; white-space: nowrap; }
.employee .tag { max-width: 120px; overflow: hidden; text-overflow: ellipsis; pointer-events: auto; }
.plate { font-weight: 600; pointer-events: none; }
.agent { display: none; opacity: .75; }
.employee:hover .tag, .employee:focus-visible .tag { max-width: 240px; z-index: 120001 !important; }
.employee:hover .agent, .employee:focus-visible .agent { display: inline; }
.employee:focus-visible .tag { outline: 2px solid Highlight; outline-offset: 1px; }

.bubble { position: absolute; top: 2px; transform: translate(-50%, -100%) scale(var(--text, 1)); transform-origin: 50% 100%;
  width: max-content; max-width: 132px; padding: 3px 7px; border: 1px solid; border-radius: 6px; font-size: 11px; line-height: 14px; font-weight: 500;
  white-space: nowrap; pointer-events: auto; }
.bubble[hidden] { display: none; }
.bubble.alert { border-color: #8f1d22; background: #e5484d; color: #fff; }
.bubble.done { border-color: #1f6940; background: #34d399; color: #0b2a1c; }
.mark { font-weight: 700; margin-right: 4px; }
.employee:hover .bubble, .employee:focus-visible .bubble { z-index: 120000 !important; }

@media (prefers-reduced-motion: reduce) {
  .sprite.loop { animation: none; }
  .employee[data-walking] { transition: none; }
}
</style></head><body>
<div id="page">
  <p id="notice" role="status"></p>
  <div id="stage"><div id="room" role="group" aria-label="Office">
    <div id="room-props"></div><div id="stations"></div><div id="employees"></div>
  </div></div>
  <div id="empty" hidden><p id="empty-title"></p><p id="empty-hint"></p></div>
</div>
<script src="sprites.js"></script>
<script src="layout.js"></script>
<script src="office.js"></script>
</body></html>
